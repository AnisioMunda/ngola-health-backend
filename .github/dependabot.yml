# Actualizações semanais de dependências. As versões menores e correcções vêm num só PR por
# ecossistema; as versões maiores vêm separadas, para rever com calma.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Luanda
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Luanda
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
