# ============================================================
# Ngola Health — configuração base
# Valores sensíveis vêm do ficheiro .env (raiz do backend) ou de
# variáveis de ambiente. Ver .env.example.
# ============================================================

spring:
  application:
    name: ngolahealth-backend
  config:
    # O .env é procurado na pasta de execução: backend/ (./mvnw, terminal) ou a raiz do
    # workspace (botão Run do VS Code). O primeiro encontrado define os valores.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  autoconfigure:
    # Autenticação própria (JWT); evita o utilizador em memória com password gerada.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: dev

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:ngolahealth}?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: NgolaHealthPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      # O esquema é gerido exclusivamente pelo Liquibase.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true
        # UUIDs guardados como CHAR(36): legíveis no cliente mysql.
        type:
          preferred_uuid_jdbc_type: CHAR

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  web:
    error:
      include-message: never
      include-stacktrace: never
      include-exception: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080
  servlet:
    context-path: /api

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  # Fuso horário que define o "dia" local (senhas de triagem, validades, relatórios).
  time-zone: Africa/Luanda
  auth:
    # Segredo HS256 em Base64 (>= 256 bits). Gerar com: openssl rand -base64 32
    jwt-secret: ${JWT_SECRET:}
    issuer: ngolahealth
    access-token-ttl: 15m
    # Validade do refresh token; renova-se a cada utilização (sessão deslizante).
    refresh-token-ttl: 12h
    max-failed-attempts: 5
    lock-duration: 15m
  triage:
    # Tempos-alvo (minutos) do protocolo de Manchester; validar com a direcção clínica.
    target-minutes:
      RED: 0
      ORANGE: 10
      YELLOW: 60
      GREEN: 120
      BLUE: 240
  notifications:
    # Notificações mais antigas do que isto são apagadas (lidas ou não).
    retention: 90d
    cleanup-cron: "0 15 3 * * *"
    # Resumo diário de stock para a farmácia (hora local de app.time-zone).
    stock-alert-cron: "0 30 7 * * *"
    stock-expiry-days: 30
  scheduling:
    # Marcações aceites até este número de dias no futuro.
    max-days-ahead: 180
    # Resumo da agenda de amanhã para cada médico (hora local de app.time-zone).
    reminder-cron: "0 0 18 * * *"
  equipment:
    # Resumo diário de manutenções/calibrações vencidas ou a vencer (hora local de app.time-zone).
    due-cron: "0 0 7 * * *"
  metrics:
    # Credenciais do Prometheus para /actuator/prometheus (HTTP Basic). Vazio = endpoint fechado.
    username: ${METRICS_USERNAME:}
    password: ${METRICS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # health é público (sondas); info e metrics exigem SUPER_ADMIN; prometheus usa credenciais próprias.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: SUPER_ADMIN
      # /actuator/health/liveness e /actuator/health/readiness para orquestradores e balanceadores.
      probes:
        enabled: true
  info:
    java:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogramas para percentis (p95/p99) no Prometheus.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.ngolahealth: INFO
    # Uma linha por pedido HTTP (método, caminho sem query string, estado, duração). WARN desliga.
    ngolahealth.http: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
  # Ficheiro opcional (LOG_FILE=/var/log/ngolahealth/backend.log); vazio = só consola.
  file:
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 2GB

---
# Perfil de desenvolvimento local (activo por omissão)
spring:
  config:
    activate:
      on-profile: dev
  liquibase:
    contexts: dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  dev:
    # Senha inicial dos utilizadores de demonstração (platform-admin, admin.hcl). Vazio = não criar.
    admin-password: ${DEV_ADMIN_PASSWORD:}
    # Cria o "Hospital Demo Ngola" com 30 dias de actividade (uma só vez). Activar com DEMO_DATA=true no .env.
    demo-data: ${DEMO_DATA:false}

logging:
  level:
    com.ngolahealth: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  liquibase:
    contexts: prod

# Produção: logs em JSON (formato Logstash), um objecto por linha, com requestId, userId e
# hospitalId vindos do MDC. Prontos para Loki, Elasticsearch ou journald.
logging:
  structured:
    format:
      console: logstash
      file: logstash
  level:
    com.ngolahealth: INFO
