# Testes de integração: base MySQL dedicada (ngolahealth_test), nunca a de desenvolvimento.
# As credenciais vêm do mesmo .env usado em desenvolvimento.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${TEST_DB_NAME:ngolahealth_test}?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
  liquibase:
    contexts: test

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.ngolahealth: INFO
